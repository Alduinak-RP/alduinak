<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-loc="window.title"></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="bg"></div>

  <div id="app">

    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-logo">
        <img class="logo-emblem" src="assets/logo-96.png" alt="">
        <div class="logo-text-block">
          <span class="logo-name" data-loc="topbar.name"></span>
          <span class="logo-tagline" data-loc="topbar.tagline"></span>
        </div>
      </div>

      <nav class="topbar-nav">
        <a class="topnav-link" data-href="website" data-loc="topbar.website"></a>
        <a class="topnav-link discord" data-href="discord" data-loc="topbar.discord"></a>
        <a class="topnav-link" data-href="patreon" data-loc="topbar.patreon"></a>
      </nav>

      <div class="topbar-right">
        <div id="nexus-topbar-slot"></div>
        <div id="discord-topbar-slot"></div>
        <button class="btn-gear" id="btn-gear" data-loc-title="settings.title">&#9881;</button>
        <button class="win-btn" id="btn-minimize" data-loc-title="topbar.minimize">&#8722;</button>
        <button class="win-btn" id="btn-maximize" data-loc-title="topbar.maximize">&#9633;</button>
        <button class="win-btn close" id="btn-close" data-loc-title="topbar.close">&#10005;</button>
      </div>
    </header>

    <!-- Main content -->
    <main class="main">
      <div class="main-header">
        <div class="status-badges">
          <span class="badge-status" id="badge-status">
            <span class="badge-dot"></span>
            <span id="badge-label" data-loc="status.checking"></span>
          </span>
          <span class="badge-players" id="badge-players" hidden></span>
          <span class="badge-players badge-locked" id="badge-locked" hidden>&#128274; <span data-loc="status.locked"></span></span>
        </div>
        <a class="legal-link" data-href="legal" data-loc="main.legal"></a>
      </div>

      <!-- Section titles on one bar that also separates the status row from the content -->
      <div class="section-bar">
        <div class="section-header section-header--news">
          <h2 class="section-title" data-loc="main.news"></h2>
        </div>
        <div class="section-header section-header--modlist">
          <h2 class="section-title" data-loc="main.modlist"></h2>
          <span class="modlist-count" id="modlist-count"></span>
        </div>
      </div>

      <!-- Two-column content layout -->
      <div class="content-layout">

        <!-- News -->
        <section class="news-section">
          <div class="news-grid" id="news-grid">
            <!-- populated by renderer.js -->
          </div>
        </section>

        <!-- Modlist -->
        <section class="modlist-section">
          <!-- Nexus Premium notice: shown only while the signed-in account has no premium -->
          <div class="premium-section" id="premium-notice" hidden>
            <div class="premium-box">
              <div class="premium-title" data-loc="premium.title"></div>
              <p class="premium-text" data-loc="premium.text"></p>
              <p class="premium-text" data-loc="premium.trial"></p>
              <a class="premium-link" id="premium-link" href="#">https://www.nexusmods.com/premium</a>
            </div>
          </div>
          <div class="modlist-panel" id="modlist">
            <!-- populated by renderer.js -->
          </div>
        </section>

      </div>
    </main>

    <!-- Bottom bar -->
    <footer class="bottombar">
      <div class="bottombar-info">
        <div class="info-item">
          <span class="info-label" data-loc="footer.launcher"></span>
          <span class="info-value" id="launcher-version">—</span>
        </div>
        <div class="info-item">
          <span class="info-label" data-loc="footer.client"></span>
          <span class="info-value" id="client-version">—</span>
        </div>
        <div class="info-divider"></div>
        <div class="info-item">
          <span class="info-label" data-loc="footer.server"></span>
          <span class="info-value" id="footer-server-name">—</span>
          <div class="server-picker" id="server-picker" hidden>
            <button type="button" class="server-picker-btn" id="server-picker-btn" aria-haspopup="listbox" aria-expanded="false">
              <span class="server-dot" id="server-picker-dot"></span>
              <span class="server-picker-name" id="server-picker-name"></span>
              <span class="server-picker-caret">&#9652;</span>
            </button>
            <ul class="server-menu" id="server-menu" role="listbox" hidden></ul>
          </div>
        </div>
        <!-- Footer player count hidden for now: the topbar badge shows it.
        <div class="info-divider"></div>
        <div class="info-item">
          <span class="info-label">PLAYERS</span>
          <span class="info-value" id="footer-players">—</span>
        </div>
        -->
        <div class="info-divider"></div>
        <span class="connect-warning" id="connect-warning"></span>
      </div>
      <div class="bottombar-right">
        <span class="update-pill" id="update-pill" hidden>&#10515; <span data-loc="update.available"></span></span>
        <button class="btn-play" id="btn-connect">&#9654; <span data-loc="play.play"></span></button>
      </div>
    </footer>

  </div>

  <!-- Settings modal -->
  <div class="modal-overlay" id="modal-settings" hidden>
    <div class="modal-box modal-box--wide">
      <div class="modal-header">
        <span class="modal-title">&#9881;&nbsp; <span data-loc="settings.title"></span></span>
        <button class="modal-close" id="modal-close" data-loc-title="settings.close">&#10005;</button>
      </div>

      <!-- Tab bar -->
      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="install" data-loc="settings.tabs.install"></button>
        <button class="modal-tab" data-tab="settings" data-loc="settings.tabs.settings"></button>
        <button class="modal-tab" data-tab="trouble" data-loc="settings.tabs.trouble"></button>
      </div>

      <div class="modal-body">

        <!-- Install Options tab -->
        <div class="tab-panel" id="tab-install">

          <div class="settings-group">
            <label class="setting-label" data-loc="options.skyrimPath"></label>
            <div class="setting-path-row">
              <input class="setting-input" id="setting-skyrim-path" type="text"
                     placeholder="C:\Program Files (x86)\Steam\steamapps\common\Skyrim Special Edition" />
              <button class="btn-browse" id="btn-detect-path" data-loc="options.detect"></button>
              <button class="btn-browse" id="btn-browse" data-loc="options.browse"></button>
            </div>
            <p class="setting-hint setting-warning" id="skyrim-path-warning" hidden></p>
          </div>

          <div class="settings-group">
            <label class="setting-label" data-loc="options.location"></label>
            <div class="setting-path-row">
              <input class="setting-input" id="setting-base-dir" type="text"
                     placeholder="C:\Alduinak" />
              <button class="btn-browse" id="btn-browse-base" data-loc="options.browse"></button>
            </div>
          </div>

          <div class="settings-group">
            <label class="setting-label" data-loc="options.modManager"></label>
            <div class="setting-path-row">
              <select class="setting-input" id="setting-mod-manager">
                <option value="mo2" data-loc="options.mo2"></option>
                <option value="vortex" disabled data-loc="options.vortex"></option>
                <option value="none" data-loc="options.none"></option>
              </select>
              <button class="btn-browse" id="btn-open-mo2" data-loc="options.openMo2"></button>
            </div>
            <p class="setting-hint" id="mod-manager-hint"></p>
          </div>

          <div class="settings-group">
            <label class="setting-checkbox-row setting-label">
              <input type="checkbox" id="setting-isolated-game" />
              <span data-loc="options.portable"></span>
            </label>
            <p class="setting-hint" data-loc="options.portableHint"></p>
            <div class="vortex-status-row" id="isolated-install-group">
              <span class="vortex-status-dot" id="isolated-status-dot"></span>
              <span class="vortex-status-text" id="isolated-status-text" data-loc="options.checking"></span>
            </div>
            <div class="vortex-status-row">
              <span class="vortex-status-dot" id="mo2-status-dot"></span>
              <span class="vortex-status-text" id="mo2-status-text" data-loc="options.checking"></span>
            </div>
            <div class="vortex-status-row">
              <span class="vortex-status-dot" id="skse-status-dot"></span>
              <span class="vortex-status-text" id="skse-status-text" data-loc="options.checking"></span>
            </div>
            <div class="vortex-status-row">
              <span class="vortex-status-dot" id="masters-status-dot"></span>
              <span class="vortex-status-text" id="masters-status-text" data-loc="options.checking"></span>
            </div>
            <div class="vortex-status-row">
              <span class="vortex-status-dot" id="modlist-status-dot"></span>
              <span class="vortex-status-text" id="modlist-status-text" data-loc="options.checking"></span>
            </div>
          </div>

        </div>

        <!-- Settings tab -->
        <div class="tab-panel" id="tab-settings" hidden>

          <details class="settings-collapse">
            <summary data-loc="prefs.discord.summary"></summary>
            <div class="collapse-grid">
            <label class="setting-checkbox-row span-2"><input type="checkbox" id="setting-discord-presence" /><span data-loc="prefs.discord.presence"></span></label>
            <p class="setting-hint span-2" data-loc="prefs.discord.hint"></p>
            </div>
          </details>

          <details class="settings-collapse" id="voip-collapse">
            <summary data-loc="prefs.voice.summary"></summary>
            <div class="collapse-grid">
            <div class="settings-group">
              <label class="setting-label" for="voip-input" data-loc="prefs.voice.microphone"></label>
              <select class="setting-input" id="voip-input"></select>
            </div>
            <div class="settings-group">
              <label class="setting-label" for="voip-output" data-loc="prefs.voice.speaker"></label>
              <select class="setting-input" id="voip-output"></select>
            </div>
            <div class="voip-activation span-2">
              <label class="setting-checkbox-row"><input type="radio" name="voip-activation" value="ptt" id="voip-ptt" /><span data-loc="prefs.voice.ptt"></span></label>
              <label class="setting-checkbox-row"><input type="radio" name="voip-activation" value="vad" id="voip-vad" /><span data-loc="prefs.voice.vad"></span></label>
            </div>
            <div class="voip-meter span-2">
              <div class="voip-row" id="voip-threshold-row" hidden>
                <div class="voip-track"><span class="voip-arrow voip-arrow--down" id="voip-threshold" data-loc-title="prefs.voice.threshold"></span></div>
                <span class="voip-readout" id="voip-threshold-value"></span>
              </div>
              <div class="voip-row">
                <div class="voip-bar"><div class="voip-level" id="voip-level"></div><span class="voip-target"></span></div>
                <span class="voip-readout" id="voip-level-value"></span>
              </div>
              <div class="voip-row">
                <div class="voip-track"><span class="voip-arrow voip-arrow--up" id="voip-gain" data-loc-title="prefs.voice.gain"></span></div>
                <span class="voip-readout" data-loc="prefs.voice.volume"></span>
              </div>
            </div>
            <p class="setting-hint span-2" data-loc="prefs.voice.dragHint"></p>
            <div class="settings-group span-2">
              <label class="setting-label setting-label--range" for="voip-output-volume"><span data-loc="prefs.voice.othersVolume"></span> <output id="voip-output-volume-value" for="voip-output-volume">100%</output></label>
              <input class="setting-input setting-range" id="voip-output-volume" type="range" min="0" max="100" step="1" value="100" />
            </div>
            <p class="setting-hint setting-warning span-2" id="voip-error" hidden></p>
            <p class="setting-hint span-2" data-loc="prefs.voice.pttHint"></p>
            </div>
          </details>

          <details class="settings-collapse" open>
            <summary data-loc="prefs.gfx.summary"></summary>
            <p class="setting-hint" id="gfx-missing" hidden data-loc="prefs.gfx.missing"></p>
            <div class="collapse-grid" id="gfx-grid">
            <p class="setting-hint setting-warning span-2" id="gfx-mo2-off" hidden data-loc="prefs.gfx.mo2Off"></p>
            <p class="setting-hint span-2" data-loc="prefs.applyNext"></p>
            <div class="settings-group">
              <label class="setting-label" data-loc="prefs.gfx.windowMode"></label>
              <select class="setting-input" id="gfx-windowmode">
                <option value="borderless" data-loc="prefs.gfx.borderless"></option>
                <option value="windowed" data-loc="prefs.gfx.windowed"></option>
                <option value="fullscreen" data-loc="prefs.gfx.fullscreen"></option>
              </select>
            </div>
            <div class="settings-group">
              <label class="setting-label" data-loc="prefs.gfx.aspect"></label>
              <select class="setting-input" id="gfx-aspect"></select>
            </div>
            <div class="settings-group">
              <label class="setting-label" data-loc="prefs.gfx.resolution"></label>
              <select class="setting-input" id="gfx-resolution"></select>
            </div>
            <div class="settings-group">
              <label class="setting-label" data-loc="prefs.gfx.texQuality"></label>
              <select class="setting-input" id="gfx-texquality">
                <option value="high" data-loc="prefs.level.high"></option>
                <option value="medium" data-loc="prefs.level.medium"></option>
                <option value="low" data-loc="prefs.level.low"></option>
              </select>
            </div>
            <div class="settings-group">
              <label class="setting-label" data-loc="prefs.gfx.aa"></label>
              <select class="setting-input" id="gfx-aa">
                <option value="taa" data-loc="prefs.gfx.taa"></option>
                <option value="fxaa" data-loc="prefs.gfx.fxaa"></option>
                <option value="off" data-loc="prefs.level.off"></option>
              </select>
            </div>
            <div class="settings-group">
              <label class="setting-label" data-loc="prefs.gfx.shadowQuality"></label>
              <select class="setting-input" id="gfx-shadowquality">
                <option value="ultra" data-loc="prefs.level.ultra"></option>
                <option value="high" data-loc="prefs.level.high"></option>
                <option value="medium" data-loc="prefs.level.medium"></option>
                <option value="low" data-loc="prefs.level.low"></option>
              </select>
            </div>
            <div class="settings-group">
              <label class="setting-label" data-loc="prefs.gfx.decals"></label>
              <select class="setting-input" id="gfx-decals">
                <option value="high" data-loc="prefs.level.high"></option>
                <option value="medium" data-loc="prefs.level.medium"></option>
                <option value="off" data-loc="prefs.level.off"></option>
              </select>
            </div>
            <div class="settings-group">
              <label class="setting-label" data-loc="prefs.gfx.godrays"></label>
              <select class="setting-input" id="gfx-godrays">
                <option value="high" data-loc="prefs.level.high"></option>
                <option value="medium" data-loc="prefs.level.medium"></option>
                <option value="low" data-loc="prefs.level.low"></option>
                <option value="off" data-loc="prefs.level.off"></option>
              </select>
            </div>
            <div class="settings-group">
              <label class="setting-label" data-loc="prefs.gfx.distant"></label>
              <select class="setting-input" id="gfx-distant">
                <option value="ultra" data-loc="prefs.level.ultra"></option>
                <option value="high" data-loc="prefs.level.high"></option>
                <option value="medium" data-loc="prefs.level.medium"></option>
                <option value="low" data-loc="prefs.level.low"></option>
              </select>
            </div>
            <div class="settings-group">
              <label class="setting-label" data-loc="prefs.gfx.fade"></label>
              <select class="setting-input" id="gfx-fade">
                <option value="high" data-loc="prefs.level.high"></option>
                <option value="medium" data-loc="prefs.level.medium"></option>
                <option value="low" data-loc="prefs.level.low"></option>
              </select>
            </div>
            <div class="settings-group span-2">
              <label class="setting-label setting-label--range" for="gfx-fov"><span data-loc="prefs.gfx.fov"></span> <output id="gfx-fov-value" for="gfx-fov">80</output></label>
              <input class="setting-input setting-range" id="gfx-fov" type="range" min="60" max="140" step="1" value="80" />
              <p class="setting-hint" data-loc="prefs.gfx.fovHint"></p>
              <p class="setting-hint setting-warning" id="gfx-fov-error" hidden data-loc="prefs.gfx.fovError"></p>
            </div>
            <label class="setting-checkbox-row"><input type="checkbox" id="gfx-ssr" /><span data-loc="prefs.gfx.ssr"></span></label>
            <label class="setting-checkbox-row"><input type="checkbox" id="gfx-ao" /><span data-loc="prefs.gfx.ao"></span></label>
            <label class="setting-checkbox-row"><input type="checkbox" id="gfx-precip" /><span data-loc="prefs.gfx.precip"></span></label>
            <label class="setting-checkbox-row"><input type="checkbox" id="gfx-snow" /><span data-loc="prefs.gfx.snow"></span></label>
            <label class="setting-checkbox-row"><input type="checkbox" id="gfx-lensflare" /><span data-loc="prefs.gfx.lensFlare"></span></label>
            <label class="setting-checkbox-row"><input type="checkbox" id="gfx-hdr64" /><span data-loc="prefs.gfx.hdr64"></span></label>
            </div>
          </details>

          <details class="settings-collapse">
            <summary data-loc="prefs.hk.summary"></summary>
            <p class="setting-hint" id="hk-missing" hidden data-loc="prefs.installModsFirst"></p>
            <div class="collapse-grid" id="hk-grid">
            <div class="settings-group"><label class="setting-label" data-loc="prefs.hk.chat"></label><button type="button" class="setting-input hotkey-btn" id="hk-chat"></button></div>
            <div class="settings-group"><label class="setting-label" data-loc="prefs.hk.cursor"></label><button type="button" class="setting-input hotkey-btn" id="hk-cursor"></button></div>
            <div class="settings-group"><label class="setting-label" data-loc="prefs.hk.voicePtt"></label><button type="button" class="setting-input hotkey-btn" id="hk-voice-ptt"></button></div>
            <div class="settings-group"><label class="setting-label" data-loc="prefs.hk.hideUi"></label><button type="button" class="setting-input hotkey-btn" id="hk-hide-ui"></button></div>
            <div class="settings-group"><label class="setting-label" data-loc="prefs.hk.altInteract"></label><button type="button" class="setting-input hotkey-btn" id="hk-alt-interact"></button></div>
            <div class="settings-group"><label class="setting-label" data-loc="prefs.hk.emoteWheel"></label><button type="button" class="setting-input hotkey-btn" id="hk-emote-wheel"></button></div>
            <p class="setting-hint span-2" data-loc="prefs.hk.hint"></p>
            <p class="setting-hint setting-warning span-2" id="hk-conflict" hidden data-loc="prefs.hk.conflict"></p>
            <p class="setting-hint setting-warning span-2" id="hk-duplicate" hidden></p>
            </div>
          </details>

          <details class="settings-collapse">
            <summary data-loc="prefs.ghk.summary"></summary>
            <p class="setting-hint" id="ghk-missing" hidden data-loc="prefs.installModsFirst"></p>
            <div class="collapse-grid" id="ghk-grid">
            <label class="setting-checkbox-row span-2"><input type="checkbox" id="gfx-invert-y" /><span data-loc="prefs.ghk.invertY"></span></label>
            <div class="ghk-rows" id="ghk-rows"></div>
            <p class="setting-hint span-2" data-loc="prefs.ghk.hint"></p>
            <p class="setting-hint setting-warning span-2" id="ghk-duplicate" hidden></p>
            </div>
          </details>

        </div>

        <!-- Troubleshooting tab -->
        <div class="tab-panel" id="tab-trouble" hidden>

          <div class="settings-group">
            <label class="setting-label" data-loc="trouble.quickLinks"></label>
            <div class="vortex-status-row install-buttons-row">
              <button class="btn-detect-vortex" data-open-folder="install" data-loc="trouble.openInstall"></button>
              <button class="btn-detect-vortex" data-open-folder="skyrim" data-loc="trouble.openSkyrim"></button>
              <button class="btn-detect-vortex" data-open-folder="logs" data-loc="trouble.openLogs"></button>
            </div>
          </div>

          <div class="settings-group">
            <label class="setting-label" data-loc="trouble.install"></label>
            <div class="vortex-status-row install-buttons-row">
              <button class="btn-detect-vortex" id="btn-install-mo2" data-loc="trouble.installMo2"></button>
              <button class="btn-detect-vortex" id="btn-copy-game" data-loc="trouble.copyGame"></button>
              <button class="btn-detect-vortex" id="btn-clean-masters" data-loc="trouble.cleanMasters"></button>
              <button class="btn-detect-vortex" id="btn-install-skse" data-loc="trouble.installSkse"></button>
              <button class="btn-detect-vortex" id="btn-download-mods" disabled data-loc="trouble.downloadMods"></button>
            </div>
          </div>

          <div class="settings-group">
            <label class="setting-label" data-loc="trouble.repair"></label>
            <div class="vortex-status-row install-buttons-row">
              <button class="btn-detect-vortex" id="btn-repair-modlist" disabled data-loc="trouble.repairModlist"></button>
              <button class="btn-detect-vortex" id="btn-repair-game" data-loc="trouble.repairGame"></button>
            </div>
            <p class="setting-hint" data-loc="trouble.strayHint"></p>
            <p class="setting-hint" data-loc="trouble.mastersCredit"></p>
          </div>

          <div class="settings-group">
            <label class="setting-label" data-loc="trouble.console"></label>
            <pre class="install-progress" id="install-progress"></pre>
          </div>

        </div>

      </div>
    </div>
  </div>


  <script src="en_loc.js"></script>
  <script src="loc.js"></script>
  <script src="bridge.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
