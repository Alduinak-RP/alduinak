[package]
name = "alduinak-launcher"
version = "2.5.0"
description = "Launcher for the Alduinak server"
authors = ["F02K", "Suraru"]
license = "MIT"
edition = "2021"

[lib]
name = "alduinak_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "time", "sync", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
url = "2"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
winreg = "0.52"
discord-rich-presence = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
