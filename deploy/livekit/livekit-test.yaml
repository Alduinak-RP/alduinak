# LiveKit server config for the Test Server voice chat (single-node, in-memory).
# Keys are generated by deploy/testserver/setup-testserver.ps1 into C:\Alduinak\livekit-test\livekit.yaml.
# Replace the placeholders below before starting.
port: 7890
rtc:
  # UDP media range clients connect to. Open these in the firewall.
  port_range_start: 50300
  port_range_end: 50500
  tcp_port: 7891
  use_external_ip: true
keys:
  # apiKey: apiSecret  (generate real values; do not ship these placeholders)
  REPLACE_API_KEY: REPLACE_API_SECRET
logging:
  level: info
