# LiveKit server config for Alduinak voice chat (single-node, in-memory).
# Keys are generated by setup-livekit.ps1 (or `livekit-server generate-keys`).
# Replace the placeholders below before starting.
port: 7880
rtc:
  # UDP media range clients connect to. Open these in the firewall.
  port_range_start: 50000
  port_range_end: 50200
  tcp_port: 7881
  use_external_ip: true
keys:
  # apiKey: apiSecret  (generate real values; do not ship these placeholders)
  REPLACE_API_KEY: REPLACE_API_SECRET
logging:
  level: info
