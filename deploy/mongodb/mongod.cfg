# MongoDB config for the Alduinak world DB.
# Bound to loopback only; the game server connects over 127.0.0.1.
systemLog:
  destination: file
  path: C:\Alduinak\mongodb\log\mongod.log
  logAppend: true
storage:
  dbPath: C:\Alduinak\mongodb\data
net:
  bindIp: 127.0.0.1
  port: 27017
security:
  # Auth on. Create the skymp user before the game server connects
  # (see deploy/mongodb/setup-mongodb.ps1 or docs/alduinak_mongodb_migration.md).
  authorization: enabled
