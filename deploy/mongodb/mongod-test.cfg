# MongoDB config for the Test Server world DB (AlduinakMongoTest).
# A second mongod next to the live one: its own port, data and log.
systemLog:
  destination: file
  path: C:\Alduinak\mongodb-test\log\mongod.log
  logAppend: true
storage:
  dbPath: C:\Alduinak\mongodb-test\data
net:
  bindIp: 127.0.0.1
  port: 27018
security:
  # Auth on. deploy/testserver/setup-testserver.ps1 creates the skymp user.
  authorization: enabled
