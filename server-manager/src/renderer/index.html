<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title data-loc="app.title"></title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="../../../skymp5-backend/public/dashboard/faction-editor.css" />
</head>
<body>
  <nav id="tabs">
    <button class="tab active" data-tab="console" data-loc="tabs.console"></button>
    <button class="tab" data-tab="players" data-loc="tabs.players"></button>
    <button class="tab" data-tab="factions" data-loc="tabs.factions"></button>
    <button class="tab" data-tab="build" data-loc="tabs.build"></button>
    <button class="tab" data-tab="schedule" data-loc="tabs.schedule"></button>
    <button class="tab" data-tab="news" data-loc="tabs.news"></button>
    <button class="tab" data-tab="settings" data-loc="tabs.settings"></button>
    <button class="tab" data-tab="security"><span data-loc="tabs.security"></span> <span class="count-badge" id="security-badge" hidden></span></button>
  </nav>
  <main>
    <section id="console" class="panel active">
      <div id="console-columns" class="console-columns"></div>
    </section>

    <section id="players" class="panel">
      <div class="row">
        <input id="player-search" type="text" data-loc-placeholder="players.searchPlaceholder" autocomplete="off" />
        <div class="dropdown">
          <button id="players-filter-btn" class="action" data-loc="players.filters"></button>
          <div id="players-filter-menu" class="dropdown-menu" hidden></div>
        </div>
        <select id="players-sort" data-loc-title="players.sortBy"></select>
        <button id="players-refresh" class="action" data-loc="common.refresh"></button>
        <span id="players-count" class="status"></span>
      </div>
      <div class="split resizable">
        <ul id="players-list" class="players"></ul>
        <div id="player-detail" class="detail">
          <p class="muted" data-loc="players.selectHint"></p>
        </div>
      </div>
    </section>

    <section id="factions" class="panel">
      <div id="faction-editor"></div>
    </section>

    <section id="build" class="panel">
      <div class="build-cols">
        <div class="build-col">
          <h3 data-loc="build.server.title"></h3>
          <div class="field">
            <label><span data-loc="build.liveVersion"></span> <span class="muted">(versions.json)</span></label>
            <div class="row">
              <input id="server-live-version" type="text" placeholder="1.0.0" />
              <button id="server-live-save" class="action small" data-loc="common.save"></button>
            </div>
          </div>
          <div class="field">
            <label><span data-loc="build.testVersion"></span> <span class="muted" id="server-test-published"></span></label>
            <div class="row">
              <input id="server-version" type="text" placeholder="1.0.0" />
              <button id="server-save" class="action small" data-loc="common.save"></button>
            </div>
          </div>
          <small data-loc-html="build.server.help"></small>
          <label class="chk"><input type="checkbox" id="build-server-native" /> <span data-loc="build.runCmake"></span></label>
          <button id="build-gamemode" class="action" data-loc="build.server.gamemodeOnly"></button>
          <button id="build-server" class="action go" data-loc="build.server.button"></button>
        </div>
        <div class="build-col">
          <h3 data-loc="build.client.title"></h3>
          <div class="field">
            <label><span data-loc="build.liveVersion"></span> <span class="muted">(versions.json)</span></label>
            <div class="row">
              <input id="client-live-version" type="text" placeholder="1.0.0" />
              <button id="client-live-save" class="action small" data-loc="common.save"></button>
            </div>
          </div>
          <div class="field">
            <label><span data-loc="build.testVersion"></span> <span class="muted" id="client-test-published"></span></label>
            <div class="row">
              <input id="client-version" type="text" placeholder="1.0.0" />
              <button id="client-save" class="action small" data-loc="common.save"></button>
            </div>
          </div>
          <small data-loc-html="build.client.help"></small>
          <label class="chk"><input type="checkbox" id="build-client-native" /> <span data-loc="build.runCmake"></span></label>
          <button id="modlist-run" class="action" data-loc="build.client.updateModlist"></button>
          <span id="modlist-gate" class="gate" hidden></span>
          <button id="modlist-purge-restore" class="action small stop" hidden data-loc="build.client.restorePurge"></button>
          <button id="build-client" class="action go" data-loc="build.client.button"></button>
        </div>
        <div class="build-col">
          <h3 data-loc="build.migrate.title"></h3>
          <div class="field">
            <label><span data-loc="build.migrate.live"></span> <span class="muted" id="migrate-live-now"></span></label>
            <div class="row">
              <input id="migrate-live-server" type="text" data-loc-placeholder="build.migrate.serverPlaceholder" />
              <input id="migrate-live-client" type="text" data-loc-placeholder="build.migrate.clientPlaceholder" />
              <button id="migrate-live-copy" class="action small" data-loc="build.migrate.copyTestBuild"></button>
              <button id="migrate-live-save" class="action small" data-loc="common.save"></button>
            </div>
          </div>
          <div class="field">
            <label><span data-loc="build.migrate.test"></span> <span class="muted" id="migrate-test-now"></span></label>
            <div class="row">
              <input id="migrate-test-server" type="text" data-loc-placeholder="build.migrate.serverPlaceholder" />
              <input id="migrate-test-client" type="text" data-loc-placeholder="build.migrate.clientPlaceholder" />
              <button id="migrate-test-copy" class="action small" data-loc="build.migrate.copyTestBuild"></button>
              <button id="migrate-test-save" class="action small" data-loc="common.save"></button>
            </div>
          </div>
          <small data-loc-html="build.migrate.help"></small>
          <span id="migrate-gate" class="gate" hidden></span>
          <button id="migrate-server" class="action" data-loc="build.migrate.server"></button>
          <button id="migrate-client" class="action go" data-loc="build.migrate.client"></button>
        </div>
        <div class="build-col">
          <h3 data-loc="build.launcher.title"></h3>
          <div class="field">
            <label><span data-loc="build.launcher.version"></span> <span class="muted" id="launcher-live"></span></label>
            <div class="row">
              <input id="launcher-version" type="text" placeholder="1.0.0" />
              <button id="launcher-save" class="action small" data-loc="common.save"></button>
            </div>
          </div>
          <div class="field">
            <label><span data-loc="build.launcher.downloadUrl"></span> <span class="muted">(versions.json launcherUrl)</span></label>
            <div class="row">
              <input id="launcher-url" type="text" placeholder="https://alduinak.com/download" />
              <button id="launcher-url-save" class="action small" data-loc="common.save"></button>
            </div>
          </div>
          <small data-loc-html="build.launcher.help"></small>
          <button id="build-launcher" class="action go" data-loc="build.launcher.button"></button>
        </div>
      </div>
      <div id="modlist-diff" class="cards"></div>
      <pre id="build-log" class="log"></pre>
    </section>

    <section id="schedule" class="panel">
      <div id="schedule-runner" class="sched-runner"></div>
      <div class="row">
        <label for="schedule-tz" class="muted" data-loc="schedule.timeZone"></label>
        <input id="schedule-tz" type="text" list="schedule-tz-list" placeholder="America/New_York" autocomplete="off" />
        <datalist id="schedule-tz-list"></datalist>
        <button id="schedule-add" class="action" data-loc="schedule.addTask"></button>
        <button id="schedule-reload" class="action" data-loc="common.reload"></button>
        <button id="schedule-save" class="action go" data-loc="common.save"></button>
        <span id="schedule-status" class="status"></span>
      </div>
      <small><span data-loc-html="schedule.help"></span> <code id="schedule-file"></code>.</small>
      <table class="sched-table">
        <thead><tr><th data-loc="schedule.col.on"></th><th data-loc="schedule.col.task"></th><th data-loc="schedule.col.server"></th><th data-loc="schedule.col.time"></th><th data-loc="schedule.col.days"></th><th data-loc="schedule.col.text"></th><th data-loc="schedule.col.next"></th><th></th></tr></thead>
        <tbody id="schedule-tasks"></tbody>
      </table>
      <pre id="schedule-log" class="log"></pre>
    </section>

    <section id="news" class="panel">
      <div class="row">
        <button id="news-refresh" class="action" data-loc="common.reload"></button>
        <button id="news-new" class="action go" data-loc="news.newEntry"></button>
        <span id="news-status" class="status"></span>
      </div>
      <small data-loc="news.help"></small>
      <div class="split">
        <ul id="news-list" class="players"></ul>
        <div id="news-detail" class="detail">
          <p class="muted" data-loc="news.selectHint"></p>
        </div>
      </div>
    </section>

    <section id="settings" class="panel">
      <div class="subtabs">
        <button class="subtab active" data-cfg="serverSettings">server-settings.json</button>
        <button class="subtab" data-cfg="testServerSettings">server-settings.json <span data-loc="settings.testSuffix"></span></button>
        <button class="subtab" data-cfg="backendEnv" data-loc="settings.backendEnv"></button>
      </div>
      <div class="row">
        <button id="settings-reload" class="action" data-loc="common.reload"></button>
        <button id="settings-save" class="action go" data-loc="common.save"></button>
        <span id="settings-status" class="status"></span>
      </div>
      <div id="settings-form" class="settings-form"></div>
    </section>

    <section id="security" class="panel">
      <div class="split">
        <ul id="security-kinds" class="players narrow"></ul>
        <div id="security-detail" class="detail wide">
          <p class="muted" data-loc="security.selectHint"></p>
        </div>
      </div>
    </section>
  </main>

  <div id="char-modal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 id="cm-title" data-loc="players.cm.title"></h3>
        <span id="cm-status" class="status"></span>
        <button id="cm-close" class="action small" data-loc="common.close"></button>
      </div>
      <small data-loc="players.cm.help"></small>
      <div id="cm-main" class="cm-main"></div>
      <div id="cm-faction" class="cm-faction"></div>
      <div class="modal-cols">
        <div class="modal-col" id="cm-appearance"></div>
        <div class="modal-col" id="cm-inventory"></div>
      </div>
    </div>
  </div>

  <script src="loc.js"></script>
  <script src="renderer.js"></script>
  <script src="console.js"></script>
  <script src="players.js"></script>
  <script src="build.js"></script>
  <script src="schedule.js"></script>
  <script src="security.js"></script>
  <script src="../../../skymp5-backend/public/dashboard/dash-loc.js"></script>
  <script src="../../../skymp5-backend/public/dashboard/faction-editor.js"></script>
  <script src="factions.js"></script>
</body>
</html>
